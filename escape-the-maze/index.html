<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Побег из Лабиринта</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            color: #4ade80;
        }
        .instructions {
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #cbd5e1;
            line-height: 1.6;
        }
        .stats-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-box {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #475569;
            border-radius: 10px;
            padding: 15px 25px;
            min-width: 120px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .size-control {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #475569;
            border-radius: 10px;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .size-control label {
            font-size: 0.9em;
            color: #94a3b8;
        }
        .size-control input[type="range"] {
            width: 150px;
            cursor: pointer;
        }
        .size-control .size-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #4ade80;
        }
        .stat-label {
            font-size: 0.9em;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #4ade80;
        }
        .replay-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 25px;
            font-size: 1em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .replay-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        .replay-btn:active {
            transform: translateY(0);
        }
        .maze-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            position: relative;
        }
        .maze-wrapper {
            position: relative;
            border: 3px solid #4ade80;
            border-radius: 5px;
            padding: 5px;
            background: #0f172a;
        }
        .maze {
            display: grid;
            gap: 0;
            background: #1e293b;
        }
        .cell {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .wall {
            background: #ffffff;
        }
        .path {
            background: #1e293b;
        }
        .start {
            background: #1e293b;
        }
        .finish {
            background: #22c55e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .player {
            width: 14px;
            height: 14px;
            background: #3b82f6;
            border-radius: 50%;
            position: absolute;
            transition: all 0.15s ease;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
            z-index: 10;
        }
        .flag-icon {
            color: white;
            font-size: 12px;
        }
        .hint-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.85em;
            z-index: 5;
        }
        .tip {
            margin-top: 20px;
            padding: 15px;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 10px;
            color: #cbd5e1;
            font-size: 0.95em;
            border-left: 4px solid #4ade80;
        }
        .bonus-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(34, 197, 94, 0.95);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 1.5em;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            display: none;
            animation: popIn 0.5s ease;
        }
        @keyframes popIn {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 41, 59, 0.98);
            color: white;
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 1.2em;
            z-index: 1000;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            display: none;
            text-align: center;
            border: 2px solid #4ade80;
        }
        .game-over h2 {
            color: #4ade80;
            margin-bottom: 15px;
        }
        .game-over-stats {
            margin: 15px 0;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Побег из Лабиринта</h1>
        <div class="stats-panel">
            <div class="stat-box">
                <div class="stat-label">Время</div>
                <div class="stat-value" id="time">00:00.0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Шаги</div>
                <div class="stat-value" id="steps">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Размер</div>
                <div class="stat-value" id="mazeSize">19 x 19</div>
            </div>
            <div class="size-control">
                <label for="sizeSlider">Размер лабиринта:</label>
                <input type="range" id="sizeSlider" min="9" max="35" value="19" step="2">
                <div class="size-value" id="sizeValue">19 x 19</div>
            </div>
            <button class="replay-btn" id="replayBtn">
                <span>↻</span> Повторить
            </button>
        </div>
        <div class="maze-container">
            <div class="maze-wrapper" id="mazeWrapper">
                <div class="hint-overlay">Используйте стрелки для движения</div>
                <div class="maze" id="maze"></div>
                <div class="player" id="player"></div>
            </div>
        </div>
    </div>
    <div class="bonus-message" id="bonusMessage"></div>
    <div class="game-over" id="gameOver">
        <h2>Поздравляем!</h2>
        <div class="game-over-stats" id="gameOverStats"></div>
        <button class="replay-btn" onclick="resetGame()">Играть снова</button>
    </div>
    <script>
        let MAZE_SIZE = 19;
        let maze = [];
        let playerPos = { x: 1, y: 1 };
        let startTime = null;
        let timerInterval = null;
        let steps = 0;
        let shortestPath = null;
        let gameWon = false;
        function initGame() {
            generateMaze();
            renderMaze();
            resetPlayer();
            resetTimer();
            steps = 0;
            gameWon = false;
            updateSteps();
            calculateShortestPath();
            updateSizeDisplay();
        }
        function updateSizeDisplay() {
            document.getElementById('mazeSize').textContent = `${MAZE_SIZE} x ${MAZE_SIZE}`;
            const sizeValue = document.getElementById('sizeValue');
            const sizeSlider = document.getElementById('sizeSlider');
            if (sizeValue) {
                sizeValue.textContent = `${MAZE_SIZE} x ${MAZE_SIZE}`;
            }
            if (sizeSlider) {
                sizeSlider.value = MAZE_SIZE;
            }
        }
        function generateMaze() {
            maze = Array(MAZE_SIZE).fill(null).map(() =>
                Array(MAZE_SIZE).fill(1)
            );
            function carve(x, y) {
                maze[y][x] = 0;
                const directions = [
                    [0, 2], [2, 0], [0, -2], [-2, 0]
                ];
                for (let i = directions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [directions[i], directions[j]] = [directions[j], directions[i]];
                }
                for (const [dx, dy] of directions) {
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx > 0 && nx < MAZE_SIZE - 1 &&
                        ny > 0 && < MAZE_SIZE - 1 &&
                        maze[ny][nx] === 1) {
                        maze[y + dy / 2][x + dx / 2] = 0;
                        carve(nx, ny);
                    }
                }
            }
            carve(1, 1);
            maze[1][1] = 0;
            maze[MAZE_SIZE - 2][MAZE_SIZE - 2] = 0;
        }
        function renderMaze() {
            const mazeElement = document.getElementById('maze');
            mazeElement.innerHTML = '';
            mazeElement.style.gridTemplateColumns = `повтор(${MAZE_SIZE}, 20 пикселей)`;
            for (let y = 0; y < MAZE_SIZE; y++) {
                for (let x = 0; x < MAZE_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (maze[y][x] === 1) {
                        cell.classList.add('wall');
                    } else {
                        cell.classList.add('path');
                        if (x === 1 && y === 1) {
                            cell.classList.add('start');
                        } else if (x === MAZE_SIZE - 2 && y === MAZE_SIZE - 2) {
                            cell.classList.add('finish');
                            cell.innerHTML = '<span class="flag-icon">🚩</span>';
                        }
                    }
                    mazeElement.appendChild(cell);
                }
            }
        }
        function resetPlayer() {
            playerPos = { x: 1, y: 1 };
            updatePlayerPosition();
        }
        function updatePlayerPosition() {
            const player = document.getElementById('player');
            const cellSize = 20;
            player.style.left = `${playerPos.x * cellSize + 3} пикселей`;
            player.style.top = `${playerPos.y * cellSize + 3} пикселей`;
        }
        function movePlayer(dx, dy) {
            if (gameWon) return;
            const newX = playerPos.x + dx;
            const newY = playerPos.y + dy;
            if (newX >= 0 && newX < MAZE_SIZE &&
                newY >= 0 && новыйY < MAZE_SIZE &&
                maze[newY][newX] === 0) {
                playerPos.x = newX;
                playerPos.y = newY;
                updatePlayerPosition();
                steps++;
                updateSteps();
                if (startTime === null) {
                    startTimer();
                }
                if (newX === MAZE_SIZE - 2 && newY === MAZE_SIZE - 2) {
                    winGame();
                }
            }
        }
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    movePlayer(0, -1);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    movePlayer(0, 1);
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    movePlayer(-1, 0);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    movePlayer(1, 0);
                    break;
            }
        });
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 100);
        }
        function updateTimer() {
            if (startTime === null) return;
            const elapsed = Date.now() - startTime;
            const seconds = Math.floor(elapsed / 1000);
            const milliseconds = Math.floor((elapsed % 1000) / 100);
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('time').textContent =
                `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${milliseconds}`;
        }
        function resetTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            startTime = null;
            document.getElementById('time').textContent = '00:00.0';
        }
        function updateSteps() {
            document.getElementById('steps').textContent = steps;
        }
        function calculateShortestPath() {
            const queue = [{ x: 1, y: 1, path: [] }];
            const visited = new Set();
            visited.add('1,1');
            const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
            while (queue.length > 0) {
                const current = queue.shift();
                if (current.x === MAZE_SIZE - 2 && current.y === MAZE_SIZE - 2) {
                    shortestPath = current.path.length;
                    return;
                }
                for (const [dx, dy] of directions) {
                    const nx = current.x + dx;
                    const ny = current.y + dy;
                    const key = `${nx},${ny}`;
                    if (nx >= 0 && nx < MAZE_SIZE &&
                        ny >= 0 && ny < MAZE_SIZE &&
                        maze[ny][nx] === 0 &&
                        !visited.has(key)) {
                        visited.add(key);
                        queue.push({
                            x: nx,
                            y: ny,
                            path: [...current.path, { x: nx, y: ny }]
                        });
                    }
                }
            }
        }
        function winGame() {
            gameWon = true;
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            const finalTime = document.getElementById('time').textContent;
            let bonusText = '';
            if (shortestPath !== null && steps === shortestPath) {
                bonusText = '🎉 БОНУС: Кратчайший путь! 🎉';
                showBonusMessage(bonusText);
            }
            setTimeout(() => {
                showGameOver(finalTime, steps, shortestPath, bonusText);
            }, bonusText ? 2000 : 500);
        }
        function showBonusMessage(text) {
            const bonusMsg = document.getElementById('bonusMessage');
            bonusMsg.textContent = text;
            bonusMsg.style.display = 'block';
            setTimeout(() => {
                bonusMsg.style.display = 'none';
            }, 2000);
        }
        function showGameOver(time, playerSteps, optimalSteps, bonus) {
            const gameOver = document.getElementById('gameOver');
            const stats = document.getElementById('gameOverStats');
            let statsText = `Время: ${time}<br>`;
            statsText += `Ваши шаги: ${playerSteps}<br>`;
            if (optimalSteps !== null) {
                statsText += `Оптимальный путь: ${optimalSteps} шагов<br>`;
            }
            if (bonus) {
                statsText += `<br><strong style="color: #4ade80;">${bonus}</strong>`;
            }
            stats.innerHTML = statsText;
            gameOver.style.display = 'block';
        }
        function resetGame() {
            document.getElementById('gameOver').style.display = 'none';
            initGame();
        }
        document.getElementById('replayBtn').addEventListener('click', resetGame);
        const sizeSlider = document.getElementById('sizeSlider');
        let sizeChangeTimeout = null;
        sizeSlider.addEventListener('input', (e) => {
            const newSize = parseInt(e.target.value);
            const sizeValue = document.getElementById('sizeValue');
            if (sizeValue) {
                sizeValue.textContent = `${newSize} x ${newSize}`;
            }
            clearTimeout(sizeChangeTimeout);
            sizeChangeTimeout = setTimeout(() => {
                if (newSize !== MAZE_SIZE) {
                    MAZE_SIZE = newSize;
                    updateSizeDisplay();
                    resetGame();
                }
            }, 500);
        });
        initGame();
    </script>
</body>
</html>
